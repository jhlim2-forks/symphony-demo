<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <style>
    body { max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: sans-serif; color: #222; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .7rem; }
    button { padding: .7rem 1rem; }
    #error { color: #b42318; min-height: 1.5em; }
    li { padding: .4rem 0; }
    .due-date { font-size: .9em; color: #666; }
  </style>
</head>
<body>
  <h1>할 일 목록</h1>
  <form id="todo-form">
    <input id="title" aria-label="할 일 제목" placeholder="할 일을 입력하세요" maxlength="200">
    <label for="due-date">마감일(선택)</label>
    <input id="due-date" type="date" aria-label="마감일(선택)">
    <button type="submit">추가</button>
  </form>
  <p id="error" role="alert"></p>
  <ul id="todos"></ul>
  <p id="empty-message" hidden>아직 할 일이 없으니 위 입력 칸에서 첫 할 일을 추가해 보세요.</p>
  <script>
    const list = document.getElementById('todos');
    const error = document.getElementById('error');
    const emptyMessage = document.getElementById('empty-message');
    function render(items) {
      list.replaceChildren();
      emptyMessage.hidden = items.length !== 0;
      for (const item of items) {
        const row = document.createElement('li');
        const title = document.createElement('span');
        title.textContent = item.title;
        row.append(title);
        if (item.dueDate !== null) {
          const dueDate = document.createElement('span');
          dueDate.className = 'due-date';
          dueDate.textContent = ` 마감일 ${item.dueDate}`;
          row.append(dueDate);
        }
        list.append(row);
      }
    }
    async function refresh() {
      const response = await fetch('/api/todos');
      const data = await response.json();
      render(data.todos);
    }
    document.getElementById('todo-form').addEventListener('submit', async event => {
      event.preventDefault();
      error.textContent = '';
      const input = document.getElementById('title');
      const dueDateInput = document.getElementById('due-date');
      const response = await fetch('/api/todos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value, dueDate: dueDateInput.value })
      });
      const data = await response.json();
      if (!response.ok) { error.textContent = data.error; return; }
      input.value = '';
      dueDateInput.value = '';
      await refresh();
    });
    refresh();
  </script>
</body>
</html>
